[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml4seeding"
version = "0.1.0a1"
description = "Machine learning for precision aerial seeding: microsite classification from drone imagery."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "UBC FRESH Lab"}]
keywords = [
    "semantic-segmentation",
    "drone-imagery",
    "reforestation",
    "aerial-seeding",
    "machine-learning",
    "remote-sensing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "Pillow>=10.0",
    "matplotlib>=3.7",
    "typer>=0.9",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/UBC-FRESH/fresh-ml4seeding"
Documentation = "https://ubc-fresh.github.io/fresh-ml4seeding/"
Repository = "https://github.com/UBC-FRESH/fresh-ml4seeding"
Issues = "https://github.com/UBC-FRESH/fresh-ml4seeding/issues"
Changelog = "https://github.com/UBC-FRESH/fresh-ml4seeding/blob/main/CHANGE_LOG.md"

[project.optional-dependencies]
ml = [
    "tensorflow>=2.15",
    "scikit-learn>=1.3",
    "imageio>=2.31",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.5",
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "twine>=5",
]
quality = [
    "ruff>=0.5",
]
release = [
    "build>=1.2",
    "twine>=5",
]
test = [
    "pytest>=8",
]

[project.scripts]
ml4seeding = "ml4seeding.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tmp", "external"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
